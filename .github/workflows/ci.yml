name: CI

on:
  push:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --locked --all-targets --no-default-features
      - run: cargo check --locked --all-targets --no-default-features --features interceptor
      - run: cargo check --locked --all-targets --no-default-features --features seeding
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - name: Build an external consumer from packaged source
        run: |
          consumer_dir="$(mktemp -d)"
          cargo new --quiet --bin "$consumer_dir/consumer"
          packaged_source="$GITHUB_WORKSPACE/target/package/stealth-oxide-0.1.1"
          cat >> "$consumer_dir/consumer/Cargo.toml" <<EOF
          stealth-oxide = { path = "$packaged_source", features = ["interceptor", "seeding"] }
          EOF
          cargo check --manifest-path "$consumer_dir/consumer/Cargo.toml"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --locked --all-targets --all-features

  chromium-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
      - name: Verify the supported Chromium major
        run: docker compose run --rm stealth-oxide chromium --version | grep -E '^(Chromium|Google Chrome for Testing) 151\.'
      - run: docker compose run --rm stealth-oxide

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - quality
      - msrv
      - chromium-integration
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Verify every CI job passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          CHROMIUM_INTEGRATION_RESULT: ${{ needs.chromium-integration.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$MSRV_RESULT" = success
          test "$CHROMIUM_INTEGRATION_RESULT" = success
          test "$AUDIT_RESULT" = success
