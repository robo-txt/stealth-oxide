name: CI

on:
  push:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  chromium-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm stealth-oxide

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - quality
      - msrv
      - chromium-integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify every CI job passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          CHROMIUM_INTEGRATION_RESULT: ${{ needs.chromium-integration.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$MSRV_RESULT" = success
          test "$CHROMIUM_INTEGRATION_RESULT" = success
