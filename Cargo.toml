[package]
name = "stealth-oxide"
version = "0.1.0"
edition = "2024"
description = "Typed Chromiumoxide browser profiles and CDP emulation configuration"
license = "MIT"
repository = "https://github.com/robo-txt/stealth-oxide"
readme = "README.md"
keywords = ["chromium", "cdp", "chromiumoxide", "browser", "automation"]
categories = ["web-programming", "development-tools::testing"]

[dependencies]
anyhow = "1.0.102"
chromiumoxide = "0.9.1"
futures = "0.3.32"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"

[dev-dependencies]
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
