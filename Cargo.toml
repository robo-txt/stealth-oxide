[package]
name = "stealth-oxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Typed Chromiumoxide browser profiles and CDP emulation configuration"
license = "MIT"
repository = "https://github.com/robo-txt/stealth-oxide"
homepage = "https://github.com/robo-txt/stealth-oxide"
documentation = "https://docs.rs/stealth-oxide"
readme = "README.md"
keywords = ["chromium", "cdp", "chromiumoxide", "browser", "automation"]
categories = ["web-programming", "development-tools::testing"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/docs/compatibility.md",
    "/docs/releasing.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/LICENSE",
]

[features]
default = []
interceptor = []
seeding = ["dep:serde"]

[dependencies]
chromiumoxide = "0.9.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.150"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
anyhow = "1.0.102"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[[example]]
name = "profile_seeding"
required-features = ["seeding"]
