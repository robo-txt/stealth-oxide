[package]
name = "stealth-oxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Typed Chromiumoxide browser profiles and CDP emulation configuration"
license = "MIT"
repository = "https://github.com/robo-txt/stealth-oxide"
homepage = "https://github.com/robo-txt/stealth-oxide"
documentation = "https://docs.rs/stealth-oxide"
readme = "README.md"
keywords = ["chromium", "cdp", "chromiumoxide", "browser", "automation"]
categories = ["web-programming", "development-tools::testing"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/README.md",
    "/LICENSE",
]

[features]
default = []
seeding = ["dep:serde", "dep:serde_json", "dep:url"]

[dependencies]
chromiumoxide = "0.9.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
thiserror = "2.0.18"
url = { version = "2.5.8", optional = true }

[dev-dependencies]
anyhow = "1.0.102"
futures = "0.3.32"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5.8"

[[example]]
name = "seeded_profile"
required-features = ["seeding"]
