<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Reversible isolation: use only fonts supplied in the mounted directory. -->
  <reset-dirs />
  <dir>/usr/local/share/fonts/windows</dir>
  <cachedir>/home/stealth/.cache/fontconfig-windows</cachedir>
  <rescan>
    <int>0</int>
  </rescan>
</fontconfig>
